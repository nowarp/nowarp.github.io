name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      ALGOLIA_APP_ID: ${{ secrets.ALGOLIA_APP_ID }}
      ALGOLIA_API_KEY: ${{ secrets.ALGOLIA_API_KEY }}
      ALGOLIA_INDEX_NAME: ${{ secrets.ALGOLIA_INDEX_NAME }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn

      - name: Checkout Misti
        uses: actions/checkout@v4
        with:
          repository: nowarp/misti
          path: _deps/misti

      - name: Checkout Souffle.js
        uses: actions/checkout@v4
        with:
          repository: nowarp/souffle.js
          path: _deps/souffle.js

      - name: Install dependencies
        run: |
          yarn install --frozen-lockfile
          yarn --cwd _deps/misti install
          yarn --cwd _deps/souffle.js install

      - name: Build site
        env:
          MISTI_PATH: _deps/misti
          SOUFFLE_PATH: _deps/souffle.js
        run: yarn build

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
          publish_branch: gh-pages
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
